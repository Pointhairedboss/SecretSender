# Hermes Agent Configuration for Google Cloud Run Multi-Agent Reflector (uat-agent-reflector)
# Installed at /app/hermes.yaml and /root/.hermes/config.yaml inside the container.
# Project: gen-lang-client-0057994039 (australia-southeast1 / global Vertex AI)
# Schema: Hermes _config_version 50

_config_version: 50

display:
  tool_progress: all
  interface: cli

onboarding:
  seen:
    busy_input_prompt: true

approvals:
  mode: 'off'
  timeout: 300
  cron_mode: approve
  single_query_mode: approve
  unattended_mode: approve

terminal:
  backend: local
  cwd: /app
  home_mode: auto
  timeout: 600

model:
  default: gemini-3.8-flash
  provider: google-vertex
  base_url: https://aiplatform.googleapis.com/v1beta1/projects/gen-lang-client-0057994039/locations/global/publishers/google
  openai_base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_mode: chat_completions
  context_length: 1048576
  max_tokens: 4096
  persist_switch_by_default: true

providers:
  google-vertex:
    name: Google Cloud Vertex AI (Global Endpoint - Paid via GCP Credits on gen-lang-client-0057994039)
    api: http://127.0.0.1:8080/v1
    vertex_api: https://aiplatform.googleapis.com/v1beta1/projects/gen-lang-client-0057994039/locations/global/publishers/google
    api_key: gcp-metadata-oauth
    transport: chat_completions
    default_model: gemini-3.8-flash
    discover_models: false
    context_length: 1048576
    models:
      gemini-3.8-flash:
        context_length: 1048576
      gemini-3.5-flash:
        context_length: 1048576
      gemini-3.5-flash-lite:
        context_length: 1048576
      gemma-4-26b-a4b-it-maas:
        context_length: 262144

  gemini:
    name: Google AI Studio / Gemini Native & OpenAI-Compat
    api: https://generativelanguage.googleapis.com/v1beta/openai
    native_api: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GOOGLE_API_KEY
    transport: chat_completions
    default_model: gemini-3.8-flash
    discover_models: true
    context_length: 1048576
    models:
      gemini-3.8-flash:
        context_length: 1048576
      gemini-3.5-flash:
        context_length: 1048576
      gemini-3.5-flash-lite:
        context_length: 1048576

model_aliases:
  flash:
    model: gemini-3.8-flash
    provider: google-vertex
  lite:
    model: gemini-3.5-flash-lite
    provider: google-vertex
  gemma4:
    model: gemma-4-26b-a4b-it-maas
    provider: google-vertex

fallback_providers:
  - provider: google-vertex
    model: gemini-3.5-flash-lite
    base_url: http://127.0.0.1:8080/v1

agent:
  max_turns: 50
  disabled_toolsets:
    - a2a
    - bot_room
    - computer_use
    - connections
    - desktop_ui
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - kanban
    - spotify
    - stt
    - tts
    - video
    - video_gen
    - x_search
    - yuanbao
