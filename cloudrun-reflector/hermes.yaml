    transport: chat_completions
    default_model: gemini-2.5-flash
    discover_models: true
    context_length: 1048576
    models:
      gemini-2.5-flash:
        context_length: 1048576
      gemini-2.5-pro:
        context_length: 1048576
      gemini-3-flash-preview:
